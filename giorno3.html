<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Giorno 3 - Sudoku Natalizio</title>
    <link rel="stylesheet" href="style.css">
<style>
        /* Contenitore di gioco */
        .game-container.active {
            background: #fff;
            border: 3px solid var(--oro);
            border-radius: 15px;
            padding: 15px;
            max-width: 380px;
            margin: 15px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Immagine di Canva come struttura visiva */
        .canva-board-container {
            position: relative;
            width: 100%;
            max-width: 330px;
            margin: 0 auto 15px auto;
        }

        .canva-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        /* Griglia trasparente allineata ai bordi marroni di Canva */
        .sudoku-overlay-grid {
            position: absolute;
            top: 34.2%;
            left: 20.6%;
            width: 57.3%;
            height: 51.3%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 2px;
        }

        /* Caselle trasparenti: si vedono solo i numeri e le tue linee! */
        .sudoku-cell {
            background: transparent;
            color: var(--verde);
            font-size: 1.45rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }

        /* Numeri fissi (già presenti) in bordeaux */
        .sudoku-cell.fixed {
            color: var(--bordeaux);
            cursor: default;
        }

        /* Cella selezionata per scrivere: leggero evidenzia-casella */
        .sudoku-cell.selected {
            background: rgba(212, 175, 55, 0.25); /* Leggero alone dorato */
            box-shadow: inset 0 0 0 2px var(--oro);
        }

        /* Pulsantiera numerica in basso */
        .number-pad {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .num-btn {
            width: 44px;
            height: 44px;
            background: var(--verde);
            color: var(--crema);
            border: 2px solid var(--oro);
            border-radius: 10px;
            font-size: 1.25rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .num-btn:active {
            transform: scale(0.9);
        }

        .num-btn.eraser {
            background: var(--bordeaux-scuro);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- 1. SCHERMATA INIZIALE CON IL PACCO DI CANVA -->
    <div class="gift-screen" id="giftScreen">
        <div class="day-badge">GIORNO 3</div>
        <img src="Pacco_chiuso3.png" alt="Pacco Giorno 3" class="gift-img" onclick="scartaRegalo()">
        <p class="tap-hint">Tocca il pacco per scoprire la sorpresa di oggi! ✨</p>
    </div>

    <!-- 2. IL MINIGIOCO SUDOKU -->
    <div class="game-container" id="gameContainer">
        
        <div class="canva-board-container">
            <img src="scacchiera3.png" alt="Scacchiera Sudoku Natalizia" class="canva-img">
            <div class="sudoku-overlay-grid" id="sudokuGrid"></div>
        </div>

        <div class="number-pad">
            <button class="num-btn" onclick="inserisciNumero(1)">1</button>
            <button class="num-btn" onclick="inserisciNumero(2)">2</button>
            <button class="num-btn" onclick="inserisciNumero(3)">3</button>
            <button class="num-btn" onclick="inserisciNumero(4)">4</button>
            <button class="num-btn eraser" onclick="inserisciNumero(0)">⌫</button>
        </div>

        <button class="btn-gold" onclick="verificaSudoku()">Verifica Soluzione</button>
        <div class="feedback-msg" id="feedbackMsg"></div>
    </div>

    <script>
        const soluzioneValida = [
            [1, 2, 3, 4],
            [3, 4, 1, 2],
            [2, 1, 4, 3],
            [4, 3, 2, 1]
        ];

        const puzzle = [
            [1, 0, 3, 0],
            [0, 4, 0, 2],
            [2, 0, 4, 0],
            [0, 3, 0, 1]
        ];

        let statoCorrente = [];
        let cellaSelezionata = null;

        function scartaRegalo() {
            document.getElementById('giftScreen').style.display = 'none';
            document.getElementById('gameContainer').classList.add('active');
            inizializzaSudoku();
        }

        function inizializzaSudoku() {
            statoCorrente = puzzle.map(riga => [...riga]);
            disegnaGriglia();
        }

        function disegnaGriglia() {
            const grid = document.getElementById('sudokuGrid');
            grid.innerHTML = '';

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const cella = document.createElement('div');
                    cella.className = 'sudoku-cell';
                    
                    const valore = statoCorrente[r][c];
                    if (valore !== 0) {
                        cella.textContent = valore;
                    }

                    if (puzzle[r][c] !== 0) {
                        cella.classList.add('fixed');
                    } else {
                        cella.onclick = () => selezionaCella(r, c);
                    }

                    if (cellaSelezionata && cellaSelezionata.r === r && cellaSelezionata.c === c) {
                        cella.classList.add('selected');
                    }

                    grid.appendChild(cella);
                }
            }
        }

        function selezionaCella(r, c) {
            cellaSelezionata = { r, c };
            disegnaGriglia();
        }

        function inserisciNumero(num) {
            if (!cellaSelezionata) return;
            const { r, c } = cellaSelezionata;
            statoCorrente[r][c] = num;
            disegnaGriglia();
        }

        function verificaSudoku() {
            const feedback = document.getElementById('feedbackMsg');
            let completato = true;
            let corretto = true;

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (statoCorrente[r][c] === 0) completato = false;
                    if (statoCorrente[r][c] !== soluzioneValida[r][c]) corretto = false;
                }
            }

            if (!completato) {
                feedback.style.color = "#e74c3c";
                feedback.textContent = "⚠️ Ci sono ancora caselle vuote!";
                return;
            }

            if (corretto) {
                feedback.style.color = "#2ecc71";
                feedback.innerHTML = "🎉 <strong>Meraviglioso!</strong> Hai risolto il Sudoku delle feste! 🌟<br><br><span style='color: var(--oro); font-size: 0.9rem;'>Torna domani per una nuova sorpresa!</span>";
            } else {
                feedback.style.color = "#e74c3c";
                feedback.textContent = "❌ C'è qualche errore nello schema, controlla bene!";
            }
        }
    </script>
</body>
</html>
