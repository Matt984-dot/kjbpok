<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Giorno 12 - Vero o Falso</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: var(--bordeaux-scuro, #3d020f);
            color: #f5ebd6;
        }

        .tf-game-container {
            display: none;
            position: relative;
            max-width: 420px;
            width: 92%;
            margin: 15px auto;
            border: 3px solid var(--oro, #d4af37);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
            background-color: #2c351e;
            padding: 0;
            box-sizing: border-box;
            text-align: center;
        }

        .tf-game-container.active {
            display: block;
        }

        .tf-board-img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        .tf-controls {
            padding: 14px 12px 18px;
            box-sizing: border-box;
        }

        .tf-row-card {
            background: rgba(20, 25, 13, 0.84);
            border: 1.5px solid rgba(212, 175, 55, 0.7);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 10px;
            text-align: left;
        }

        .tf-row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .tf-q-label {
            font-size: 0.94rem;
            font-weight: bold;
            color: #f5ebd6;
            display: flex;
            align-items: center;
        }

        .tf-q-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #e5b324;
            color: #242b17;
            font-size: 0.85rem;
            font-weight: bold;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .tf-mini-btns {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .tf-choice-btn {
            min-width: 44px;
            height: 38px;
            padding: 0 12px;
            border-radius: 10px;
            border: 2px solid #e5b324;
            background: #242b17;
            color: #f5ebd6;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.12s ease, background-color 0.16s ease, color 0.16s ease;
        }

        .tf-choice-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .tf-choice-btn:disabled {
            cursor: default;
            opacity: 0.75;
        }

        .tf-choice-btn.corretta {
            background: #247a42;
            border-color: #7ef2a6;
            color: #ffffff;
            opacity: 1;
        }

        .tf-choice-btn.errata {
            background: #9e1b24;
            border-color: #ff9aa1;
            color: #ffffff;
            opacity: 1;
        }

        .tf-explanation {
            display: none;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed rgba(245, 235, 214, 0.28);
            font-size: 0.84rem;
            line-height: 1.35;
            color: #f7e6b5;
        }

        .tf-explanation.visible {
            display: block;
        }

        .tf-summary-box {
            display: none;
            margin-top: 12px;
            background: #f5ebd6;
            color: var(--bordeaux-scuro, #3d020f);
            border: 2px solid var(--oro, #d4af37);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.94rem;
            font-weight: bold;
        }

        .tf-summary-box.visible {
            display: block;
        }

        .tf-reset-btn {
            margin-top: 10px;
            background: var(--bordeaux-scuro, #3d020f);
            color: #f5ebd6;
            border: 2px solid var(--oro, #d4af37);
            border-radius: 20px;
            padding: 7px 18px;
            font-size: 0.84rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. SCHERMATA INIZIALE CON IL PACCO -->
    <div class="gift-screen" id="giftScreen">
        <div class="day-badge">GIORNO 12</div>
        <img src="Pacco_chiuso12.png" alt="Pacco Giorno 12" class="gift-img" onclick="scartaRegalo()" style="cursor: pointer;">
        <p class="tap-hint">Tocca il pacco per scoprire la sorpresa di oggi! ✨</p>
    </div>

    <!-- 2. GIOCO VERO O FALSO -->
    <div class="tf-game-container" id="tfGame">
        <img src="verofalso12.png" alt="Vero o Falso" class="tf-board-img" id="tfBoardImg">

        <div class="tf-controls">
            <div id="tfRowsList"></div>

            <div class="tf-summary-box" id="tfSummaryBox">
                <div id="tfScoreText"></div>
                <button class="tf-reset-btn" onclick="riavviaQuiz()">↺ Gioca ancora</button>
            </div>
        </div>
    </div>

    <script>
        const domandeGiorno12 = [
            {
                numero: 1,
                risposta: true,
                spiegazione: "Vero! Esiste davvero Christmas Island (Isola di Natale), un'isola nell'Oceano Indiano a sud-est di Giava."
            },
            {
                numero: 2,
                risposta: false,
                spiegazione: "Falso: a Cuba, ufficialmente per non interrompere la raccolta della canna da zucchero, tra il 1968 il 1997 i festeggiamenti erano stati spostati a luglio."
            },
            {
                numero: 3,
                risposta: true,
                spiegazione: "Vero! Fu donata dalla Francia agli Stati Uniti nel 1886 per celebrare il centenario dell'indipendenza americana ed è tra i regali più grandi e celebri della storia."
            },
            {
                numero: 4,
                risposta: false,
                spiegazione: "Falso: è in Ucraina si é solito vedere alberi decorati con ragnatele, stranamente associati ai concetti di prosperità e fortuna. La leggenda narra di una povera vedova, rimasta sola e senza nemmeno un soldo per comprare il cibo e le decorazioni per il suo albero di Natale. Durante una notte venne aiutata da una famiglia di ragni che, per ringraziarla dell’ospitalità di un luogo caldo e asciutto in casa mentre fuori esplodeva una bufera di neve, la ripagarono decorando l’albero con delle bellissime ragnatele. Al mattino dopo, al risveglio, queste si trasformarono in bellissimi fili d’oro e d’argento."
            }
        ];

        let risposteDate = {};
        let punteggio = 0;

        function scartaRegalo() {
            document.getElementById('giftScreen').style.display = 'none';
            document.getElementById('tfGame').classList.add('active');
            inizializzaQuiz();
        }

        function inizializzaQuiz() {
            risposteDate = {};
            punteggio = 0;

            document.getElementById('tfSummaryBox').classList.remove('visible');

            const list = document.getElementById('tfRowsList');
            list.innerHTML = '';

            domandeGiorno12.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'tf-row-card';

                card.innerHTML = `
                    <div class="tf-row-top">
                        <div class="tf-q-label">
                            <span class="tf-q-num">${item.numero}</span>Domanda ${item.numero}
                        </div>
                        <div class="tf-mini-btns">
                            <button type="button" class="tf-choice-btn" id="btn-v-${idx}" onclick="selezionaRisposta(${idx}, true)">V</button>
                            <button type="button" class="tf-choice-btn" id="btn-f-${idx}" onclick="selezionaRisposta(${idx}, false)">F</button>
                        </div>
                    </div>
                    <div class="tf-explanation" id="exp-${idx}"></div>
                `;

                list.appendChild(card);
            });
        }

        function selezionaRisposta(idx, scelta) {
            if (risposteDate[idx] !== undefined) return;
            risposteDate[idx] = scelta;

            const item = domandeGiorno12[idx];
            const btnV = document.getElementById(`btn-v-${idx}`);
            const btnF = document.getElementById(`btn-f-${idx}`);
            const expBox = document.getElementById(`exp-${idx}`);

            btnV.disabled = true;
            btnF.disabled = true;

            const btnCorretto = item.risposta ? btnV : btnF;
            const btnScelto = scelta ? btnV : btnF;

            btnCorretto.classList.add('corretta');

            if (scelta === item.risposta) {
                punteggio++;
                expBox.innerText = `✅ ${item.spiegazione}`;
            } else {
                btnScelto.classList.add('errata');
                expBox.innerText = `❌ ${item.spiegazione}`;
            }

            expBox.classList.add('visible');

            if (Object.keys(risposteDate).length === domandeGiorno12.length) {
                const summary = document.getElementById('tfSummaryBox');
                document.getElementById('tfScoreText').innerText =
                    `Hai totalizzato ${punteggio} risposte giuste su ${domandeGiorno12.length}!`;
                summary.classList.add('visible');
            }
        }

        function riavviaQuiz() {
            inizializzaQuiz();
        }
    </script>
</body>
</html>
